  <rect x="650" y="142" width="82" height="30" rx="15" fill="#22c55e"/><text x="672" y="162" fill="#052e16" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="900">LIVE</text>
  <rect class="card" x="95" y="230" width="210" height="235" rx="18"/>
