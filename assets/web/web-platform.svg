  <rect class="blue" x="372" y="346" width="300" height="34" rx="12"/><text x="392" y="368" fill="#075985" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13" font-weight="800">#12  Demo Driver  02:15.004</text>
