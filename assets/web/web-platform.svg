<svg xmlns="http://www.w3.org/2000/svg" width="900" height="620" viewBox="0 0 900 620" role="img" aria-labelledby="title desc">
  <title id="title">Web platform mockup</title>
  <desc id="desc">Anonymised web dashboard mockup for the MedulaSport case study.</desc>
  <defs>
    <style>.bg{fill:#fff}.shell{fill:#f8fafc;stroke:#cbd5e1}.nav{fill:#0f172a}.card{fill:#fff;stroke:#cbd5e1}.text{fill:#0f172a;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#64748b}.green{fill:#dcfce7}.blue{fill:#e0f2fe}.amber{fill:#fef3c7}@media(prefers-color-scheme:dark){.bg{fill:#0b1220}.shell{fill:#111827;stroke:#334155}.card{fill:#1f2937;stroke:#334155}.text{fill:#e5e7eb}.muted{fill:#94a3b8}.nav{fill:#020617}}</style>
  </defs>
  <rect class="bg" width="900" height="620" rx="24"/>
  <text class="text" x="46" y="56" font-size="28" font-weight="900">Public Web + Race Control</text>
  <text class="muted" x="46" y="86" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif">Anonymised interface mockup with fictitious event data.</text>
  <rect class="shell" x="60" y="120" width="780" height="420" rx="24"/>
